name: Deploy preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Northstar fixture
        working-directory: examples/enterprise-case
        run: python3 -m unittest discover -s tests -v
      - name: Test Linux fixture and CLI contract
        working-directory: examples/linux-ebpf-case
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m linux_kb ingest --help

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build documentation
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - name: Verify Mermaid was transformed
        run: '! grep -R -E ''<pre[^>]+language-mermaid'' book/.vitepress/dist/'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
