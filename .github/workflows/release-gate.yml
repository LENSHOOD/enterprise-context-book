name: Stable release gate

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  manuscript_length:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce manuscript length gate
        run: python3 scripts/wordcount.py --minimum 80000
